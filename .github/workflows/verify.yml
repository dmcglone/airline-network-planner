name: verify

# The project's rule is verify, don't assert. Cloudflare's build image has
# Python but not a browser, so the acceptance test cannot run there — it runs
# here instead, on every push and pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Build
        run: python3 build.py

      - name: Acceptance metrics and the ten checks
        run: python3 verify.py

      - name: Python reference engine agrees with the JS engine
        # Explicit bash turns on pipefail. The default shell does not, so a crash
        # in engine.py was hidden by `| tee` and the step carried on.
        shell: bash
        run: |
          python3 make_legs.py
          python3 engine.py | tee /tmp/engine.out
          python3 validate.py
          python3 - <<'EOF'
          import json, re
          from collections import Counter
          lines = json.load(open("lines.json"))["lines"]
          # Changed 26 Oct 2026, for the A320E retirement (84f0ae4, 13 Sep 2026).
          # Its routes and pinned tails moved to the A320 and verify.py went to 365
          # tails, but this split stayed at 366 and failed every push after that.
          #   A320 61 + A320E 17 -> 76, A321 66 -> 67, total 366 -> 365
          # On 45-minute turns the A320 work packs into two fewer aircraft and the
          # A321 gains one. This is the JS engine's split, tail for tail, and
          # engine.py gives the same when it has time zone data. Without it (Windows
          # with no tzdata package) every UTC offset falls back to 0 and it builds 366.
          want = {"A319":129, "A320":76, "A321":67, "E175":76, "E145":17}
          got = dict(Counter(l["type"] for l in lines))
          assert got == want, f"rotation split changed: {got} != {want}"
          assert len(lines) == 365, f"{len(lines)} rotations, expected 365"
          print("python engine: 365 rotations, split matches")
          EOF
